spring:
  application:
    name: shopping-cart

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopping_cart}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

shoppingcart:
  product:
    cache:
      key-prefix: "product:"
      ttl: 1h
  cart:
    dynamo:
      table-name: shopping_cart
      batch-size: 25
      ttl: 30d
  auth:
    token:
      ttl: 24h
  dynamo:
    region: us-east-1
    endpoint: ${DYNAMO_ENDPOINT:http://localhost:4566}
    access-key: test
    secret-key: test

